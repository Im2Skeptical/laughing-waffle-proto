plugins {
    id 'com.android.application'
}

// SDL 3.4.20 Java activity sources. bootstrap-android.ps1 extracts them here.
def localTools = new Properties()
file("${rootDir}/local.properties").withInputStream { localTools.load(it) }
def toolsDir = localTools.getProperty('waffle.tools.dir', "${rootDir}/../.tools")
def sdlJava = file("${toolsDir}/src/SDL3-3.4.20/android-project/app/src/main/java")
def debugStore = file("${toolsDir}/android-debug.keystore")

android {
    namespace = "org.waffle.nativedemo"
    compileSdkVersion 35
    // AGP 8.7.3 defaults to build-tools 34.0.0. This project installs 35.0.0.
    buildToolsVersion "35.0.0"
    ndkVersion = "30.0.16248370"

    defaultConfig {
        applicationId "org.waffle.nativedemo"
        minSdkVersion 31
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-31", "-DANDROID_STL=c++_static"
                abiFilters "arm64-v8a"
            }
        }
    }

    signingConfigs {
        debug {
            // Project-local debug key created by bootstrap-android.ps1.
            // Not a release or store credential.
            storeFile debugStore
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    sourceSets.main {
        java.srcDirs += [sdlJava]
    }

    androidResources {
        noCompress += ["ttf", "rml", "txt"]
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "4.5.0"
        }
    }

    lint {
        abortOnError = false
    }
}
