name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Game version approved for Pages (x.y.z)'
        required: true
        type: string
      confirm_publish:
        description: 'I confirm publishing this version to GitHub Pages'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Explicitly approved prototype publication; keep the branch allowlist exact.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/proto/keywords-classes') && inputs.confirm_publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check approved game version
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('package.json')).version !== process.env.APPROVED_VERSION) throw new Error('Approved version does not match checkout');"

      - name: Verify and build deployment artifact
        run: npm run verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
